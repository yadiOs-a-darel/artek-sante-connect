<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ARTEK Connect Santé — Télémédecine solaire pour la RCA" />
    <meta name="theme-color" content="#00A651" />
    <title>ARTEK Connect Santé</title>
    <script>
      (function () {
        try {
          var s = localStorage.getItem("artek-theme");
          var theme = s ? JSON.parse(s).state?.theme : "dark";
          document.documentElement.classList.toggle("dark", theme !== "light");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
